function buildCity(){

  for(let r=0;r<16;r++)for(let c=0;c<8;c++){const f=flags[r*8+c],x=c*16+2,y=r*16+3;
    A.fillStyle=f>.75?'#f3dfa8':`hsl(210,${15+f*20}%,${22+f*28}%)`;A.fillRect(x,y,12,9);if(f>.75){B.fillStyle='#ffd58a';B.fillRect(x,y,12,9);}}
  const mapT=mkTex(a),emT=mkTex(b),HS=[28,55,100,170];

  // Candidate city cells (90 m grid), skipping cells too close to the circuit
  const tp=P.filter((_,i)=>i%3==0),cells=[];
  for(let x=-1350;x<1400;x+=90)for(let z=-1350;z<1400;z+=90){const cx=x+45,cz=z+45;let d=1e9;
    for(const p of tp){const dd=(p.x-cx)**2+(p.z-cz)**2;if(dd<d)d=dd;}

  const buckets=HS.map(()=>[]);

    buckets[near?Math.min(1,rng()*2|0):Math.min(3,tall*3.4*TH.h|0)].push([cx+(rng()-.5)*8,cz+(rng()-.5)*8,34+rng()*28,34+rng()*28]);}

  const cr=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(2.4,1).translate(0,4.6,0),new THREE.MeshStandardMaterial({roughness:.9,flatShading:true}),cnt);
  for(let n=0;n<cnt;n++){const i=(n>>1)*5+(rng()*5|0),s=n&1?1:-1,o=s*(24+rng()*12),k=(OCC[i%N]||rng()>TH.trees)?1e-4:.8+rng()*.9;

    side:new THREE.MeshStandardMaterial({map:mkTex(c.cv.sc,false),roughness:.9}),helmet:new THREE.MeshPhysicalMaterial({map:mkTex(c.cv.hc,false),roughness:.25,clearcoat:1}),

  const B=c.body,{paint,base,accent}=m;c.root.add(B);

  const nose=c.nose=new THREE.Mesh(new THREE.CylinderGeometry(.07,.2,1.75,16).rotateX(Math.PI/2),base);nose.position.set(0,.3,2.18);nose.scale.y=.8;B.add(nose);

  bx(B,1.5,.05,3.5,0,.07,-.3,M.carbon);bx(B,1,.05,.8,0,.15,-2.15,M.carbon,.28);bx(B,.28,.02,.6,0,.635,0,M.carbon);          // floor, diffuser, cockpit

  const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.11,.12,4,8),m.suit);torso.position.set(0,.68,-.25);B.add(torso);bx(B,.22,.12,.03,0,.7,.4,M.carbon,.5);

/* ---- Per-frame animation: steering, spin, suspension + wishbones, pitch/roll, brake glow, rain light, debris ---- */
function updateCar(c,dt){const S=c.state,B=c.body,v=new THREE.Vector3(),a=new THREE.Vector3();
  B.rotation.set(S.pitch,0,S.roll);B.position.y=S.heave;B.updateMatrix();
  S.heat=Math.max(0,Math.min(1,S.heat+(S.brake*1.2-.25)*dt));c.m.disc.emissiveIntensity=S.heat*4;c.rain.material.emissiveIntensity=2+Math.sin(clock*14)*1.5;
  c.wheels.forEach((w,i)=>{w.piv.rotation.y=w.fr?S.steer*.5:0;w.spin.rotation.x+=S.speed/w.R*dt;w.holder.position.y=w.R+S.susp[i];});
  c.arms.forEach(r=>{const w=c.wheels[r.i].holder;a.copy(r.a).applyMatrix4(B.matrix);v.set(w.position.x-r.s*.05,w.position.y+r.hy,w.position.z);aim(r.m,a,v);});
  for(let i=c.debris.length;i--;){const d=c.debris[i],p=d.m.position;d.v.y-=9.8*dt;p.addScaledVector(d.v,dt);d.m.rotation.x+=d.w*dt;d.m.rotation.z+=d.w*dt*.7;
    if(p.y<.05){p.y=.05;d.v.multiplyScalar(.5);d.v.y=Math.abs(d.v.y)*.4;d.w*=.6;}if((d.t-=dt)<0){scene.remove(d.m);c.debris.splice(i,1);}}}

/* ---- Damage hooks for the collision phase: damagePart(car,'fwL'|'fwR'|'rw'|'nose'|'podL'|'podR',0..1). Wings detach at 1; nose/pods deform ---- */
function damagePart(c,n,amt){const d=c.damage;d[n]=Math.min(1,(d[n]||0)+amt);const p=c.parts[n];
  if(p&&d[n]>=1&&!p.userData.gone){p.userData.gone=true;p.userData.home=p.parent;p.userData.pos=p.position.clone();p.userData.q=p.quaternion.clone();scene.attach(p);
    c.debris.push({m:p,v:new THREE.Vector3((Math.random()-.5)*4,3+Math.random()*3,(Math.random()-.5)*4),w:3+Math.random()*4,t:8});}
  if(n=='nose'){c.nose.scale.z=1-.25*d.nose;c.nose.rotation.x=.1*d.nose;}
  if(n=='podL'||n=='podR'){const k=n=='podL'?0:1,q=c.pods[k];q.scale.x=1-.15*d[n];q.rotation.z=(k?1:-1)*.12*d[n];}}
function repairCar(c){for(const n in c.parts){const p=c.parts[n];if(p.userData.gone){scene.remove(p);p.userData.home.add(p);p.position.copy(p.userData.pos);p.quaternion.copy(p.userData.q);p.userData.gone=false;}}
  c.debris.length=0;c.damage={};c.nose.scale.z=1;c.nose.rotation.x=0;c.pods.forEach(q=>{q.scale.x=1;q.rotation.z=0;});}

  const f=LAP.t*15,i=Math.floor(f);if(i>=B.length-1){G.root.visible=false;return;}const k=f-i,a=B[i],b=B[i+1];let dh=(b[2]-a[2])/100;dh=Math.atan2(Math.sin(dh),Math.cos(dh));
  G.root.visible=true;G.root.position.set((a[0]+(b[0]-a[0])*k)/10,0,(a[1]+(b[1]-a[1])*k)/10);G.root.rotation.y=a[2]/100+dh*k;}

/* ---- Track selection (Phase 6 redesign): list + large procedural preview + stat bars ---- */
function analyse(pts){const cu=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(p[0],0,p[1])),true,'centripetal'),Pp=cu.getSpacedPoints(N),T=[],K=[],V=[],ds=cu.getLength()/N;
  for(let i=0;i<N;i++)T.push(cu.getTangentAt(i/N).setY(0).normalize());for(let i=0;i<N;i++){const a=T[(i+N-2)%N],b=T[(i+2)%N];K[i]=Math.abs(Math.atan2(a.x*b.z-a.z*b.x,a.x*b.x+a.z*b.z))/(4*ds);}
  for(let i=0;i<N;i++){let k=0;for(let j=-3;j<=3;j++)k=Math.max(k,K[(i+j+N)%N]);V[i]=Math.min(120,Math.sqrt(38/Math.max(k,1e-4)));}
  const drs=[];let run=0,best=0,tot=0;for(let i=0;i<=N;i++){if(i<N&&K[i]<.004)run++;else{if(run>=20){drs.push([i-run,i-1]);tot+=run;}best=Math.max(best,run);run=0;}}
  const cn=findCorners(V,T).map(c=>c.i);return{P:Pp,len:cu.getLength(),cn,corners:cn.length,drs,longest:best*ds,avgV:V.reduce((a,b)=>a+Math.min(b,90),0)/N,drsLen:tot*ds};}
function drawPrev(cvs,m){const g=cvs.getContext('2d'),W2=cvs.width,H2=cvs.height,pts=m.P;g.clearRect(0,0,W2,H2);const bg=g.createRadialGradient(W2/2,H2/2,10,W2/2,H2/2,W2*.7);bg.addColorStop(0,'#1d2127');bg.addColorStop(1,'#101215');g.fillStyle=bg;g.fillRect(0,0,W2,H2);
  g.fillStyle='rgba(255,255,255,.05)';for(let x=12;x<W2;x+=24)for(let y=12;y<H2;y+=24)g.fillRect(x,y,2,2);
  let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9,cx=0,cz=0;for(const p of pts){x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);z0=Math.min(z0,p.z);z1=Math.max(z1,p.z);cx+=p.x/N;cz+=p.z/N;}
  const sc=Math.min((W2-56)/(x1-x0),(H2-56)/(z1-z0)),ox=W2/2-(x0+x1)/2*sc,oz=H2/2-(z0+z1)/2*sc,X=p=>p.x*sc+ox,Y=p=>p.z*sc+oz,lw=Math.max(1,W2/210);
  const path=(a,b)=>{g.beginPath();for(let i=a;i<=b;i++){const p=pts[i%N];i==a?g.moveTo(X(p),Y(p)):g.lineTo(X(p),Y(p));}};g.lineJoin=g.lineCap='round';
  path(0,N);g.strokeStyle='rgba(255,255,255,.12)';g.lineWidth=15*lw;g.stroke();path(0,N);g.strokeStyle='rgba(236,234,228,.85)';g.lineWidth=9*lw;g.stroke();path(0,N);g.strokeStyle='#1b1e23';g.lineWidth=6*lw;g.stroke();
  [[0,4,'#ffd400'],[4,8,'#2a7bff'],[8,12,'#ff3b1f']].forEach(([a,b,c])=>{path(Math.round(a*N/12),Math.round(b*N/12));g.strokeStyle=c;g.lineWidth=1.6*lw;g.stroke();});
  g.strokeStyle='#39ff7a';g.lineWidth=3.4*lw;m.drs.forEach(([a,b])=>{path(a,b);g.stroke();});
  g.font=`800 ${Math.round(9*lw+2)}px Orbitron,sans-serif`;g.textAlign='center';g.textBaseline='middle';
  m.cn.forEach((i,k)=>{const p=pts[i],dx=X(p)-(cx*sc+ox),dz=Y(p)-(cz*sc+oz),l=Math.hypot(dx,dz)||1,qx=X(p)+dx/l*15*lw,qy=Y(p)+dz/l*15*lw;g.fillStyle='rgba(14,16,19,.85)';g.beginPath();g.arc(qx,qy,7*lw,0,6.3);g.fill();g.fillStyle='#fff';g.fillText(k+1,qx,qy+.5);});
  const p0=pts[0],p1=pts[3],a=Math.atan2(Y(p1)-Y(p0),X(p1)-X(p0));g.save();g.translate(X(p0),Y(p0));g.rotate(a);g.fillStyle='#fff';g.fillRect(-2*lw,-8*lw,4*lw,16*lw);g.fillStyle='#ff3b1f';g.beginPath();g.moveTo(14*lw,0);g.lineTo(5*lw,-6*lw);g.lineTo(5*lw,6*lw);g.fill();g.restore();}
const PREV={};function prevURL(i){if(!PREV[i]){const c=cv(300,210);drawPrev(c,TRACKS[i].m||(TRACKS[i].m=analyse(TRACKS[i].pts)));PREV[i]=c.toDataURL();}return PREV[i];}

const SERVER_URL='';   // <-- set your deployed server here, e.g. 'wss://jpedg3d.onrender.com'. Empty = same host as this page, or ws://localhost:8080 when opened from a file.
const sanName=s=>String(s||'').replace(/[^\p{L}\p{N} _.\-]/gu,'').trim().slice(0,12);
const NET={ws:null,st:'off',url:'',id:null,room:null,off:0,rtt:0,samp:[],remotes:new Map(),pool:[],sendAcc:0,seq:0,corr:null,interp:.12,oldAssist:null,hudT:0,onWelcome:null,
  name:sanName(localStorage.getItem('jp_name'))||sanName(PRO.name)||'PLAYER'};
NET.now=()=>Date.now()+NET.off;                       // estimated server clock (ms)
function netURL(){const q=new URLSearchParams(location.search).get('server'),s=localStorage.getItem('jp_srv');if(q)return q;if(s)return s;if(SERVER_URL)return SERVER_URL;
  return location.protocol=='http:'||location.protocol=='https:'?(location.protocol=='https:'?'wss://':'ws://')+location.host:'ws://localhost:8080';}
const netSend=o=>{if(NET.ws&&NET.ws.readyState==1)NET.ws.send(JSON.stringify(o));};
function netOpen(){return new Promise((res,rej)=>{if(NET.ws&&NET.ws.readyState==1&&NET.id)return res();NET.url=netURL();NET.st='connecting';if(mode=='online')renderMenu();let ws,done=false;
  try{ws=new WebSocket(NET.url);}catch(e){NET.st='off';return rej(new Error('url'));}
  const fail=e=>{if(done)return;done=true;clearTimeout(to);try{ws.close();}catch(x){}NET.st='off';rej(e);},to=setTimeout(()=>fail(new Error('timeout')),6000);
  ws.onopen=()=>ws.send(JSON.stringify({t:'hello',name:NET.name,team:gTeam}));
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(x){return;}if(m.t=='welcome'&&!done){done=true;clearTimeout(to);NET.ws=ws;NET.st='on';NET.onWelcome=res;}netMsg(m);};
  ws.onerror=()=>fail(new Error('error'));ws.onclose=()=>{if(!done)fail(new Error('closed'));else netClosed(ws);};});}
function netFail(){NET.st='off';toast(t('netfail'));if(mode=='online')renderMenu();}   // graceful fallback: offline modes keep working
async function netCreate(){try{await netOpen();netSend({t:'create',name:NET.name,team:gTeam});}catch(e){netFail();}}
async function netJoin(code){try{await netOpen();netSend({t:'join',code,name:NET.name,team:gTeam});}catch(e){netFail();}}
function netLeave(){netSend({t:'leave'});NET.room=null;}
function netClose(){try{if(NET.ws)NET.ws.close();}catch(e){}NET.ws=null;NET.id=null;NET.room=null;NET.st='off';}
setInterval(()=>{if(NET.ws&&NET.ws.readyState==1)netSend({t:'ping',c:Date.now(),r:Math.round(NET.rtt)});},2000);
function netMsg(m){switch(m.t){
  case'welcome':NET.id=m.id;NET.off=m.ts-Date.now();if(NET.onWelcome)NET.onWelcome();break;
  case'pong':{const rtt=Date.now()-m.c;NET.rtt=NET.rtt?NET.rtt*.7+rtt*.3:rtt;NET.samp.push([rtt,m.s+rtt/2-Date.now()]);if(NET.samp.length>8)NET.samp.shift();NET.off=NET.samp.reduce((a,b)=>b[0]<a[0]?b:a)[1];break;}   // clock offset from the lowest-latency sample
  case'room':netRoom(m);break;case'err':toast(t('ne_'+m.c));break;case'start':netStart(m);break;case'snap':netSnap(m);break;case'left':netLeft(m);break;case'corr':netCorr(m);break;
  case'fin':{const r=NET.room&&NET.room.players.find(p=>p.id==m.id);toast((r?r.name:'?')+' · '+t('fin')+' P'+m.pos);break;}
  case'res':netResults(m);break;}}
function netRoom(m){const old=NET.room,ph=old&&old.host;
  if(old&&state=='menu')m.players.forEach(p=>{if(!old.players.some(q=>q.id==p.id)&&p.id!=NET.id)toast(p.name+' '+t('njoin'));});
  NET.room=m;
  if(state=='menu'&&(mode=='online'||mode=='lobby')){if(mode!='lobby')go('lobby');else renderMenu();}

  menus[mode].forEach((it,i)=>{const li=document.createElement('li');if(i==sel)li.className='sel';if(it.dis&&it.dis())li.classList.add('dis');
    li.innerHTML=`<span>${it.label?it.label():t(it.k)}</span>${it.val?`<b>${it.val()}</b>`:''}`;
    li.onmouseenter=()=>{sel=i;renderMenu();};li.onclick=()=>input('ok');ul.appendChild(li);});const inf=$('minfo');inf.innerHTML=INFO[mode]?INFO[mode]():'';inf.classList.toggle('on',!!INFO[mode]);}
function input(k){uiSnd(k);
  if(state=='loaded')return startIntro(); if(state=='intro')return endIntro(); if(state=='garage')return garageInput(k); if(state=='drive'&&!paused)return driveInput(k); if(state=='tracks')return tracksInput(k); if(state=='results')return resultsInput(k); if(state!='menu'&&!(state=='drive'&&paused))return;
  const L=menus[mode],it=L[sel];
  if(k=='up')sel=(sel+L.length-1)%L.length; else if(k=='down')sel=(sel+1)%L.length;
  else if(k=='left'&&it.adj)it.adj(-1); else if(k=='right'&&it.adj)it.adj(1);
  else if(k=='ok')(it.act||(()=>it.adj(1)))(); else if(k=='back'){if(mode=='pause')setPause(false);else if(mode!='main')go(par(mode));}
  renderMenu();}
const KEYS={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Enter:'ok',Space:'ok',Escape:'back',Backspace:'back'};
addEventListener('keydown',e=>{if((state=='drive'||state=='results')&&!KEYS[e.code])return;const k=KEYS[e.code]||'ok';if(KEYS[e.code])e.preventDefault();input(k);});
addEventListener('pointerdown',()=>{if(state=='loaded')input('ok');});
// Gamepad (hot-plug aware): D-pad / left stick navigate, A/Start select, B back
addEventListener('gamepadconnected',()=>toast(t('pad')));
let prevPad={};
function pollPad(){const g=[...(navigator.getGamepads?navigator.getGamepads():[])].find(Boolean);if(!g){prevPad={};return;}
  const b=i=>g.buttons[i]&&g.buttons[i].pressed,x=g.axes[0]||0,y=g.axes[1]||0;
  const cur={up:b(12)||y<-.6,down:b(13)||y>.6,left:b(14)||x<-.6,right:b(15)||x>.6,ok:b(0)||b(9),back:b(1)};
  for(const k in cur)if(cur[k]&&!prevPad[k])input(k);prevPad=cur;}

function startIntro(){state='intro';tIntro=0;$('loader').classList.add('off');document.body.classList.add('intro');}
function endIntro(){state='menu';document.body.classList.remove('intro');document.body.classList.add('menu');renderMenu();}

/* ============================ MAIN LOOP ============================ */
const tmp=new THREE.Vector3(),tn=new THREE.Vector3(),look=new THREE.Vector3();
function cinematic(dt){ // fly-through along the spline: high & fast descent during intro, relaxed orbit behind the menu
  const intro=state=='intro';if(intro){tIntro+=dt;if(tIntro>INTRO)endIntro();}
  const e=intro?Math.min(1,tIntro/INTRO):1,ease=e*e*(3-2*e);
  u=(u+dt*(intro?.02:.006))%1;
  const h=intro?lerp(80,5,ease):13+Math.sin(clock*.3),side=intro?lerp(0,10,ease):17;
  curve.getPointAt(u,tmp);curve.getTangentAt(u,tn);tn.y=0;
  camera.position.set(tmp.x+tn.z*side,h,tmp.z-tn.x*side);
  curve.getPointAt((u+.016)%1,look);look.y=intro?lerp(0,2,ease):2;camera.lookAt(look);
  camera.fov=lerp(camera.fov,intro?lerp(80,52,ease):52,.05);camera.updateProjectionMatrix();
  fxT.speed=intro?.35*(1-ease):0;fxT.dof=intro?lerp(.2,.7,ease):1;
}
let last=0;
function frame(now){
  requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;
  pollPad();
  if(state=='garage'){garageCam(dt);updateCar(playerCar,dt);}else if(state=='drive')driveFrame(dt);else if(state!='loading')cinematic(dt);sky.position.copy(camera.position);
  clouds.forEach(c=>{c.position.x+=dt*6;if(c.position.x>4200)c.position.x=-4200;});
  // Sun + shadow frustum follow the camera focus
  tmp.copy(camera.position).add(camera.getWorldDirection(tn).multiplyScalar(70)).setY(0);
  if(state=='garage')tmp.copy(GARAGE);sun.target.position.copy(tmp);sun.position.copy(tmp).addScaledVector(sunDir,500);
  CT.value=clock;const U=fxPass.uniforms;U.uTime.value=clock%100;U.uSpeed.value=lerp(U.uSpeed.value,fxT.speed,.08);U.uDof.value=lerp(U.uDof.value,fxT.dof,.06);
  composer.render();adapt(dt);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();if(composer)applyQuality();});

/* ============================ BOOT ============================ */
(async()=>{
  setLang(lang);
  await step(10,initPost);
  await step(25,buildGround);
  await step(70,()=>loadTrack(curTrack));
  
  await step(85,()=>{});
  await step(95,buildClouds);
  await step(98,buildGarage);await step(99,()=>{initFX();initHUD();});await step(100,()=>{applyQuality();});
  state='loaded';$('press').style.visibility='visible';
  requestAnimationFrame(frame);
})();
</script>
